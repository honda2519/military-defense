
<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MILITARY DEFENSE</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="app">

        <!-- ヘッダー -->
        <header>
            <div>
                <small>TACTICAL COMMAND SYSTEM</small>
                <h1>MILITARY <span>DEFENSE</span></h1>
            </div>

            <!-- 戦況ステータス -->
            <div class="stats">
                <div>
                    資金
                    <strong id="money">300</strong>
                </div>

                <div>
                    ライフ
                    <strong id="lives">20</strong>
                </div>

                <div>
                    ウェーブ
                    <strong id="wave">0</strong>
                </div>

                <div>
                    撃破数
                    <strong id="kills">0</strong>
                </div>
            </div>
        </header>

        <!-- ゲーム画面と操作パネル -->
        <div class="layout">

            <!-- 戦場 -->
            <section class="board">
                <div class="caption">
                    作戦エリア / BATTLEFIELD
                    <span id="message">
                        兵器を選択して配置してください
                    </span>
                </div>

                <canvas
                    id="gameCanvas"
                    width="960"
                    height="600">
                </canvas>

                <div class="legend">
                    ● 敵の進行ルート
                    ● 設置可能エリア
                    <span id="waveStatus">待機中</span>
                </div>
            </section>

            <!-- 操作パネル -->
            <aside>

                <!-- 兵器選択 -->
                <h2>兵器選択</h2>

                <div class="choices">

                    <button class="choice selected" data-type="gun">
                        <i class="gun"></i>
                        <b>
                            機関銃
                            <small>連射・低コスト</small>
                        </b>
                        <strong>$100</strong>
                    </button>

                    <button class="choice" data-type="cannon">
                        <i class="cannon"></i>
                        <b>
                            砲台
                            <small>高威力</small>
                        </b>
                        <strong>$180</strong>
                    </button>

                    <button class="choice" data-type="rocket">
                        <i class="rocket"></i>
                        <b>
                            ロケット砲
                            <small>爆発攻撃</small>
                        </b>
                        <strong>$250</strong>
                    </button>

                    <button class="choice" data-type="sniper">
                        <i class="sniper"></i>
                        <b>
                            狙撃砲
                            <small>長射程・高威力</small>
                        </b>
                        <strong>$200</strong>
                    </button>

                </div>

                <!-- コマンド -->
                <h2>コマンド</h2>

                <button id="upgradeButton" class="action" disabled>
                    選択タワーを強化
                    <span>$120</span>
                </button>

                <button id="waveButton" class="action primary">
                    戦闘開始 ▶
                </button>

                <button id="soundButton" class="action">
                    🔊 音声 ON
                </button>

                <!-- BGM音量 -->
                <label class="volume">
                    BGM音量
                    <input
                        id="volumeSlider"
                        type="range"
                        min="0"
                        max="100"
                        value="10">
                    <output id="volumeValue">15%</output>
                </label>

                <!-- 効果音音量 -->
                <label class="volume">
                    効果音音量
                    <input
                        id="seVolumeSlider"
                        type="range"
                        min="0"
                        max="100"
                        value="70">
                    <output id="seVolumeValue">95%</output>
                </label>
                
                <!-- 操作説明 -->
                <p class="hint">
                    兵器を選び、マップ上の空き地をクリックして設置。
                    設置済みタワーをクリックすると強化できます。
                </p>

                <!-- 戦況レポート -->
                <h2>戦況レポート</h2>

                <div id="log">
                    防衛システム起動。
                </div>

            </aside>
        </div>

        <!-- フッター -->
        <footer>
            STANDALONE EDITION
            <span>HTML / CSS / JAVASCRIPT</span>
        </footer>

    </main>

    <!-- JavaScript -->
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>

</body>
</html>
